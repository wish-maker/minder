[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", "__pycache__", "venv", "env"]
# 'config' is a first-party, service-local module (e.g. api-gateway/config.py).
# Declared explicitly so its import placement no longer depends on an incidental
# top-level src/config/ directory (removed in the src/config→src/requirements rename).
known_first_party = ["config"]

[tool.mypy]
# The mypy gate (#33) runs per-service (each service dir is its own import root,
# matching the container WORKDIR=/app). CI installs src/requirements/requirements-
# typecheck.txt so the FastAPI/Pydantic/httpx/redis/asyncpg boundary is checked with
# REAL types instead of collapsing to Any — this is what catches Optional-boundary
# bugs (e.g. UploadFile.filename, Request.client). The pydantic plugin makes model /
# BaseSettings constructors type-check correctly (no spurious "missing named argument"
# call-arg noise). Heavy/quirky libs (torch, spacy, piper, qdrant-client, neo4j) stay
# Any via ignore_missing_imports — see requirements-typecheck.txt for the rationale.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise a running service or backend",
    "e2e: end-to-end tests across multiple services",
    "slow: tests that take a long time to run",
    "security: security-focused tests",
]
filterwarnings = [
    # All pydantic v2 class-based `Config` was migrated to ConfigDict (#75). Guard
    # against reintroduction: any Pydantic-V2-since-2.0 deprecation (class Config,
    # model.dict(), @validator, parse_obj, …) fails the suite instead of warning.
    "error::pydantic.warnings.PydanticDeprecatedSince20",
]
