<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minder — Plugin Configuration</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; text-transform: capitalize; margin-bottom: 0.25rem; }
  #auth {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.5rem;
  }
  #auth input {
    margin: 0.25rem 0.25rem 0.25rem 0;
    padding: 0.4rem;
  }
  #status { min-height: 1.2rem; margin-bottom: 1rem; }
  #status.error { color: #c0392b; }
  .plugin-card {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .field { margin-bottom: 0.75rem; }
  .field label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 0.2rem;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    padding: 0.4rem;
  }
  .hint { margin: 0.2rem 0 0; font-size: 0.8rem; opacity: 0.7; }
  .save-status { margin-left: 0.5rem; font-size: 0.85rem; opacity: 0.8; }
  button { cursor: pointer; padding: 0.4rem 0.9rem; }
</style>
</head>
<body>
<h1>Plugin Configuration</h1>
<p class="hint">
  Edit settings for plugins that expose a config schema (e.g. news feeds,
  weather locations). Changes apply immediately, no restart needed.
</p>

<div id="auth">
  <div id="login-box">
    <input id="username" placeholder="username" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="login-btn" type="button">Log in</button>
    <button id="register-toggle" type="button">New user? Register</button>
    <div id="register-box" hidden>
      <input id="reg-email" placeholder="email" autocomplete="email">
      <button id="register-btn" type="button">Register</button>
    </div>
  </div>
  <div id="session" hidden>
    Logged in as <strong id="who"></strong>
    <button id="logout-btn" type="button">Log out</button>
  </div>
</div>

<div id="status"></div>
<div id="plugins"></div>

<script>
(function () {
  "use strict";

  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var token = sessionStorage.getItem("minder_jwt") || "";
  var username = sessionStorage.getItem("minder_username") || "";

  function $(id) { return document.getElementById(id); }

  function setStatus(msg, isError) {
    var el = $("status");
    el.textContent = msg || "";
    el.className = isError ? "error" : "";
  }

  function updateAuthUI() {
    $("login-box").hidden = !!token;
    $("session").hidden = !token;
    $("who").textContent = username;
  }

  function authHeaders() {
    return token ? { "Authorization": "Bearer " + token } : {};
  }

  async function login(user, pass) {
    var res = await fetch("/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.detail || "Login failed");
    token = data.access_token;
    username = user;
    sessionStorage.setItem("minder_jwt", token);
    sessionStorage.setItem("minder_username", username);
  }

  async function register(user, email, pass) {
    var res = await fetch("/v1/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, email: email, password: pass })
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.detail || "Registration failed");
  }

  $("login-btn").addEventListener("click", async function () {
    setStatus("Logging in…");
    try {
      await login($("username").value, $("password").value);
      updateAuthUI();
      setStatus("Logged in.");
      loadPlugins();
    } catch (e) {
      setStatus(e.message, true);
    }
  });

  $("register-toggle").addEventListener("click", function () {
    $("register-box").hidden = !$("register-box").hidden;
  });

  $("register-btn").addEventListener("click", async function () {
    setStatus("Registering…");
    try {
      await register($("username").value, $("reg-email").value, $("password").value);
      setStatus("Registered — now click \"Log in\".");
    } catch (e) {
      setStatus(e.message, true);
    }
  });

  $("logout-btn").addEventListener("click", function () {
    token = "";
    username = "";
    sessionStorage.removeItem("minder_jwt");
    sessionStorage.removeItem("minder_username");
    updateAuthUI();
    $("plugins").innerHTML = "";
  });

  function fieldInput(field, value) {
    var key = esc(field.key), type = field.type || "string";
    if (type === "bool") {
      return '<input type="checkbox" data-key="' + key + '" data-type="' + type + '"' +
        (value ? " checked" : "") + ">";
    }
    if (field.secret) {
      return '<input type="password" data-key="' + key + '" data-type="' + type +
        '" data-secret="1" placeholder="unchanged (leave blank to keep current value)">';
    }
    if (type === "int" || type === "float") {
      return '<input type="number"' + (type === "float" ? ' step="any"' : "") +
        ' data-key="' + key + '" data-type="' + type + '" value="' + esc(value) + '">';
    }
    return '<input type="text" data-key="' + key + '" data-type="' + type +
      '" value="' + esc(value) + '">';
  }

  function renderPlugin(name, schema, values) {
    var rows = schema.map(function (f) {
      return '<div class="field">' +
        "<label>" + esc(f.key) + "</label>" +
        fieldInput(f, values[f.key]) +
        (f.description ? '<p class="hint">' + esc(f.description) + "</p>" : "") +
        "</div>";
    }).join("");
    return '<section class="plugin-card" data-plugin="' + esc(name) + '">' +
      "<h2>" + esc(name) + "</h2>" +
      "<form>" + rows + '<button type="submit">Save</button>' +
      '<span class="save-status"></span></form></section>';
  }

  async function loadPlugins() {
    if (!token) return;
    setStatus("Loading plugins…");
    var container = $("plugins");
    container.innerHTML = "";
    try {
      var listRes = await fetch("/v1/plugins?limit=500", { headers: authHeaders() });
      if (!listRes.ok) throw new Error("Could not list plugins");
      var list = await listRes.json();
      var found = false;
      for (var i = 0; i < list.plugins.length; i++) {
        var name = list.plugins[i].name;
        var cfgRes = await fetch("/v1/plugins/" + encodeURIComponent(name) + "/config", {
          headers: authHeaders()
        });
        if (!cfgRes.ok) continue; // not running, or 401 -- skip quietly
        var cfg = await cfgRes.json();
        if (!cfg.configurable) continue;
        found = true;
        container.insertAdjacentHTML("beforeend", renderPlugin(name, cfg.schema, cfg.values));
      }
      if (!found) {
        container.innerHTML = "<p>No configurable plugins found.</p>";
      }
      setStatus("");
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  $("plugins").addEventListener("submit", async function (ev) {
    var form = ev.target;
    if (form.tagName !== "FORM") return;
    ev.preventDefault();
    var card = form.closest(".plugin-card");
    var name = card.getAttribute("data-plugin");
    var statusEl = card.querySelector(".save-status");
    var body = {};
    form.querySelectorAll("[data-key]").forEach(function (input) {
      var key = input.getAttribute("data-key"), type = input.getAttribute("data-type");
      if (input.getAttribute("data-secret") && input.value === "") return; // unchanged
      if (type === "bool") { body[key] = input.checked; return; }
      if (type === "int") { body[key] = parseInt(input.value, 10); return; }
      if (type === "float") { body[key] = parseFloat(input.value); return; }
      body[key] = input.value;
    });
    statusEl.textContent = "Saving…";
    try {
      var res = await fetch("/v1/plugins/" + encodeURIComponent(name) + "/config", {
        method: "PUT",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify(body)
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.detail || "Save failed");
      statusEl.textContent = "Saved.";
      setTimeout(function () { statusEl.textContent = ""; }, 2000);
    } catch (e) {
      statusEl.textContent = e.message;
    }
  });

  updateAuthUI();
  if (token) loadPlugins();
})();
</script>
</body>
</html>
