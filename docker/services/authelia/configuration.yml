theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml
    # Low-memory argon2 profile (Pi-friendly, #15). Bounds per-auth RAM to ~32 MiB
    # (default is 64 MiB) for both verification and any portal password reset.
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        memory: 32768
        iterations: 3
        parallelism: 2

session:
  name: authelia_session
  secret: ${AUTHELIA_SESSION_SECRET}
  expiration: 1h
  inactivity: 5m
  remember_me: 1M
  cookies:
    - name: authelia_session
      domain: minder.local
      authelia_url: https://authelia.minder.local
      expiration: 1h
      inactivity: 5m
      default_redirection_url: https://public.minder.local

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  postgres:
    address: tcp://postgres:5432
    database: minder_authelia
    username: minder
    password: ${AUTHELIA_STORAGE_POSTGRES_PASSWORD}

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt

access_control:
  default_policy: one_factor
  rules:
    # Health/readiness probes bypass auth on every host (container/Traefik probes).
    - domain: ["*.minder.local"]
      resources: ["^/health(.*)"]
      policy: bypass
  # The forward-auth-protected hosts (minio / api / grafana / chat / jaeger
  # .minder.local — the 5 routers using authelia-forwardauth@file) inherit
  # default_policy: one_factor. Per-service two_factor hardening (api, admin) is
  # deferred to the Pi: TOTP enrollment needs the portal reachable (DNS + TLS).

identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}

# Real SSO (#<issue>): Minder's client + api-gateway authenticate against this
# provider instead of stacking their own login behind the forward-auth gate
# above -- Authelia's own hosted page becomes the platform's one login screen.
#
# This file is a TEMPLATE, not what Authelia actually reads: the jwks key
# placeholder below is substituted with the real RSA private key's content
# by scripts/setup/env.py's render_authelia_config() / scripts/lib/env.sh's
# _render_authelia_config() (Python string substitution, not Authelia's own
# Go-template engine -- that route was tried first and abandoned after it
# proved too fragile to debug reliably: raw double-curly-brace regions get
# parsed everywhere in the file INCLUDING inside comments, and error line
# numbers didn't correspond to anything inspectable). The RENDERED file
# (docker/services/authelia/configuration.rendered.yml, gitignored, never
# committed) is what's actually bind-mounted into the container; this source
# stays git-tracked with a stable placeholder token instead of key material.
# Regenerating the key file after clients exist invalidates every
# previously-issued token, so the setup script only generates it once and
# leaves it alone afterward; the render step itself is cheap and safe to
# repeat every run.
identity_providers:
  oidc:
    hmac_secret: ${AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET}
    jwks:
      - key_id: "minder"
        algorithm: "RS256"
        use: "sig"
        key: __MINDER_OIDC_ISSUER_KEY_PEM__
    clients:
      - client_id: "minder-client"
        client_name: "Minder"
        # An argon2id hash of MINDER_OIDC_CLIENT_SECRET, substituted at
        # render time by the same step that fills in the issuer key above
        # (render_authelia_config() / _render_authelia_config()) -- computed
        # fresh from the current plaintext secret on every run via a
        # throwaway `authelia crypto hash generate` container call, same
        # mechanism as the RSA key. A $plaintext$ prefix (raw secret, no
        # hash) was tried first: confirmed against a real Authelia instance
        # to fail token exchange regardless of auth method ("no client
        # authentication included") even though the plaintext value matched
        # byte-for-byte on both sides -- a real hash is what actually works,
        # not just what avoids the deprecation warning. Confidential client
        # (public: false): api-gateway holds the secret server-side and
        # performs the code exchange itself, so it is never exposed to the
        # browser.
        client_secret: __MINDER_OIDC_CLIENT_SECRET_HASH__
        public: false
        authorization_policy: one_factor
        require_pkce: false
        # No token_endpoint_auth_method override -- Authelia defaults a
        # confidential client to client_secret_basic (HTTP Basic auth on the
        # token request), which is what core/oidc.py's exchange_code_for_id_token
        # actually sends. Declaring client_secret_post here instead (to match
        # sending the secret as a POST body field) did not work in practice
        # against a real Authelia instance -- easier to match the code to
        # Authelia's default than fight this further.
        redirect_uris:
          - "https://api.minder.local/v1/auth/oidc/callback"
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
        response_types:
          - code
        userinfo_signing_algorithm: none
