theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml
    # Low-memory argon2 profile (Pi-friendly, #15). Bounds per-auth RAM to ~32 MiB
    # (default is 64 MiB) for both verification and any portal password reset.
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        memory: 32768
        iterations: 3
        parallelism: 2

session:
  name: authelia_session
  secret: ${AUTHELIA_SESSION_SECRET}
  expiration: 1h
  inactivity: 5m
  remember_me: 1M
  cookies:
    - name: authelia_session
      domain: minder.local
      authelia_url: https://authelia.minder.local
      expiration: 1h
      inactivity: 5m
      default_redirection_url: https://public.minder.local

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  postgres:
    address: tcp://postgres:5432
    database: minder_authelia
    username: minder
    password: ${AUTHELIA_STORAGE_POSTGRES_PASSWORD}

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt

access_control:
  default_policy: one_factor
  rules:
    # Health/readiness probes bypass auth on every host (container/Traefik probes).
    - domain: ["*.minder.local"]
      resources: ["^/health(.*)"]
      policy: bypass
  # The forward-auth-protected hosts (minio / api / grafana / chat / jaeger
  # .minder.local — the 5 routers using authelia-forwardauth@file) inherit
  # default_policy: one_factor. Per-service two_factor hardening (api, admin) is
  # deferred to the Pi: TOTP enrollment needs the portal reachable (DNS + TLS).

identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}

# Real SSO (#<issue>): Minder's client + api-gateway authenticate against this
# provider instead of stacking their own login behind the forward-auth gate
# above -- Authelia's own hosted page becomes the platform's one login screen.
#
# The whole file is now run through Authelia's Go-template engine BEFORE the
# YAML parser ever sees it (X_AUTHELIA_CONFIG_FILTERS=template, set on the
# authelia service below; off by default). That is why this comment avoids
# writing the literal double-curly-brace secret-loading call as an example --
# the template engine parses every double-curly-brace region in the raw file
# text, including inside YAML comments, so an example containing one here
# would fail the same way the real call below does if it were malformed.
#
# The jwks entry's key below loads the issuer's real RSA private key,
# generated once by scripts/setup/env.py's ensure_oidc_issuer_key() (never
# committed -- see docker/services/authelia/secrets/, gitignored), via that
# secret-loading call, reindented to this key's actual nesting depth (8
# spaces + 2) as a YAML literal block scalar, only quoted if the result
# somehow turned out to be a single line (never true here, but this matches
# Authelia's own documented pattern for loading a JWKS key from a file).
# Regenerating the key file after clients exist invalidates every
# previously-issued token, so the setup script only generates it once and
# leaves it alone afterward.
identity_providers:
  oidc:
    hmac_secret: ${AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET}
    jwks:
      - key_id: "minder"
        algorithm: "RS256"
        use: "sig"
        key: {{ secret "/config/secrets/oidc_issuer.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: "minder-client"
        client_name: "Minder"
        # $plaintext$ tells Authelia this is a raw secret rather than a
        # pre-hashed one (Authelia normally wants an argon2id hash here) --
        # deliberate, documented tradeoff so scripts/setup/env.py can generate
        # and rotate this the same way as every other SECRET_SPEC value,
        # without shelling out to `authelia crypto hash generate` at install
        # time. Confidential client (public: false): api-gateway holds the
        # secret server-side and performs the code exchange itself, so it is
        # never exposed to the browser.
        client_secret: "$plaintext$${MINDER_OIDC_CLIENT_SECRET}"
        public: false
        authorization_policy: one_factor
        require_pkce: false
        redirect_uris:
          - "https://api.minder.local/v1/auth/oidc/callback"
        scopes:
          - openid
          - profile
          - email
          - groups
        grant_types:
          - authorization_code
        response_types:
          - code
        userinfo_signing_algorithm: none
