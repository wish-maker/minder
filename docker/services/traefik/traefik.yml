# Traefik v3 Static Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: default
        domains:
          - main: "*.minder.local"
            sans:
              - "minder.local"

  # #646: was set only via docker-compose.yml's --entrypoints.metrics.address
  # CLI flag, which turned out to be silently ignored -- confirmed live on
  # hantal that with this file also present, Traefik's CLI-supplied
  # entryPoints entries never took effect at all (its own /api/entrypoints
  # only ever listed entries declared HERE, in the file). Declared directly
  # in the file instead, which is confirmed to actually work. Not published
  # to the host (docker-compose.yml's ports: list has no mapping for it) --
  # internal-only, reachable from other containers on minder-network.
  metrics:
    address: ":8082"

providers:
  docker:
    # Least-privilege Docker API access via docker-socket-proxy (#377) -- NOT a
    # raw socket mount. See docker-socket-proxy's allowlist comment in
    # docker-compose.yml for exactly which endpoints this needs (version/_ping
    # negotiation, container list/inspect, events stream).
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: minder-network

  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  default:
    acme:
      email: admin@minder.local
      storage: /letsencrypt/acme.json
      # #646: this resolver used to ALSO declare httpChallenge here while
      # docker-compose.yml's CLI flags separately set tlschallenge=true for
      # the same resolver -- two different, mutually exclusive ACME challenge
      # mechanisms for one resolver is undefined/ambiguous, not a real
      # fallback. Given the CLI-vs-file precedence surprises found alongside
      # this (see entryPoints.metrics below), declared tlsChallenge here
      # directly rather than trusting the CLI flag to actually apply to a
      # nested key inside a section this file also populates.
      tlsChallenge: {}

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: keep

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
