# Traefik v3 Static Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: default
        domains:
          - main: "*.minder.local"
            sans:
              - "minder.local"

providers:
  docker:
    # Least-privilege Docker API access via docker-socket-proxy (#377) -- NOT a
    # raw socket mount. See docker-socket-proxy's allowlist comment in
    # docker-compose.yml for exactly which endpoints this needs (version/_ping
    # negotiation, container list/inspect, events stream).
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: minder-network

  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  default:
    acme:
      email: admin@minder.local
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: keep

metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addServicesLabels: true
