# Traefik v3 Static Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: default
        domains:
          - main: "*.minder.local"
            sans:
              - "minder.local"

providers:
  docker:
    # Least-privilege Docker API access via docker-socket-proxy (#377) -- NOT a
    # raw socket mount. See docker-socket-proxy's allowlist comment in
    # docker-compose.yml for exactly which endpoints this needs (version/_ping
    # negotiation, container list/inspect, events stream).
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: minder-network

  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  default:
    acme:
      email: admin@minder.local
      storage: /letsencrypt/acme.json
      # #646: tlsChallenge (not httpChallenge) is the actual mechanism in use --
      # set via docker-compose.yml's --certificatesresolvers.default.acme.tlschallenge=true
      # CLI flag. This file used to ALSO declare httpChallenge here, for the
      # same resolver -- two different, mutually exclusive ACME challenge
      # mechanisms configured for one resolver is undefined/ambiguous, not a
      # real fallback. Keep the CLI flags as the single source of truth for
      # this resolver's challenge type.

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: keep

# #646: metrics.prometheus config lives ENTIRELY in docker-compose.yml's CLI
# flags now (--metrics.prometheus=true/.entrypoint=metrics/.addentrypointslabels/
# .addserviceslabels) -- this file used to ALSO declare a metrics.prometheus
# block with entryPoint: websecure, which would have put Prometheus metrics on
# the PUBLIC HTTPS entrypoint instead of the internal-only "metrics" one the
# CLI flags intend. Confirmed live on hantal that the CLI's dedicated
# entrypoint is the one actually meant to serve this -- removed the
# conflicting duplicate here rather than trying to keep two sources in sync.
