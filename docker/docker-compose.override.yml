# ============================================================================
# Docker Compose Override - Development Only
# ============================================================================
# This file re-exposes core service ports on ALL interfaces (0.0.0.0) for
# cross-machine dev access. Since #190 the main compose already publishes every
# core port on 127.0.0.1 (loopback), so `curl localhost:<port>` works WITHOUT
# this override — you only need it to reach a service from another machine.
#
# Usage (development with all-interface port access):
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#
# Usage (default - loopback-only, main compose):
#   docker compose up
# ============================================================================

services:
  # Compose requires `services` to be a non-empty mapping — with every real
  # override below commented out, an empty value here breaks bare
  # `docker compose up` entirely ("services must be a mapping"). This {} entry
  # on an always-present infra service is a guaranteed no-op merge that keeps
  # the file valid; it is not one of the toggleable services below.
  postgres: {}

  # Uncomment a service to re-expose its port on 0.0.0.0 (all interfaces).
  # Loopback (127.0.0.1:<port>) is already published by the main compose (#190).

