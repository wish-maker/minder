name: Security Scan

# Deep security scans: CodeQL (SAST) + Trivy (container CVE). Kept push/PR-triggered
# (NOT scheduled-only) — #16 chose Option 2: on this repo CodeQL is ~1min and Trivy
# ~45s (not the "heavy" scans the issue assumed), the repo is public (free CI minutes),
# and these run in parallel with ci.yml off the critical path, so gating every push
# costs ~0 wall-clock while closing the exposure window on an internet-exposed target.
# The weekly schedule stays as defense-in-depth (CVE feeds update over time).
# Light scans (bandit, safety, secrets, hadolint, license) live in quality.yml.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Her hafta çarşamba 09:00 UTC'de çalıştır
    - cron: '0 9 * * 3'
  workflow_dispatch:  # Manuel tetikleme

# Least-privilege default: most jobs here only scan, they don't need to write
# to the repo. Without this, every job ran with the repo's `write` default
# GITHUB_TOKEN permission (found in a background CI-workflow audit). The two
# jobs that upload SARIF results declare their own `security-events: write`
# override below (required by github/codeql-action/upload-sarif).
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Was api-gateway only -- a real coverage gap, since each service pulls its
        # own pip deps (torch/spacy/qdrant-client/ollama-client/audio libs, etc.) on
        # top of the shared python:3.12-slim base, so a CRITICAL/HIGH CVE unique to
        # e.g. rag-pipeline's or tts-stt's dependencies was never scanned at all.
        service:
          - api-gateway
          - graph-rag
          - marketplace
          - model-management
          - plugin-registry
          - plugin-state-manager
          - rag-pipeline
          - tts-stt
          - client

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker compose -f docker/docker-compose.yml build ${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        # Pinned to v0.36.0 (not @master): aquasecurity/trivy-action had 75 of
        # 76 version tags force-pushed with malicious code in a real 2026-03
        # supply-chain compromise (CVE-2026-33634) -- a mutable branch ref is
        # exactly this class of risk, and this repo's default GITHUB_TOKEN is
        # write-scoped. v0.36.0 postdates that incident and GitHub's immutable
        # releases protection (enabled 2026-03-04, before the only tag
        # confirmed unaffected, v0.35.0). Found in a background CI-workflow
        # audit.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'minder/${{ matrix.service }}:1.0.0'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, trivy]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🔒 Deep Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL (SAST): ${{ needs.codeql.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy (container CVE): ${{ needs.trivy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Light scans (bandit, safety, secrets, hadolint, license) run in quality.yml." >> $GITHUB_STEP_SUMMARY
