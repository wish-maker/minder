name: CI

# Build + test pipeline (unit → integration → e2e). Linting and all security
# scanning were moved out: fast linters + light scans live in quality.yml, deep
# scans (CodeQL, Trivy) in security.yml. See #16.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Manuel tetikleme

env:
  PYTHON_VERSION: '3.12'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: minder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements/requirements.txt
          pip install -r src/requirements/requirements-dev.txt

      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: minder_test
          # DB_* mirrors POSTGRES_* (#265): services on MinderBaseSettings read
          # DB_HOST/PORT/USER/PASSWORD/NAME instead of the legacy POSTGRES_* names.
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: minder_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Dummy secrets so config-importing tests + the conftest service
          # loader can instantiate Settings (services require these).
          REDIS_PASSWORD: test_password
          JWT_SECRET: test_jwt_secret_for_ci
          NEO4J_AUTH: neo4j/test_password
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --tb=short \
            --timeout=300

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # lint + security-scan moved to quality.yml (separate workflow) — cross-workflow
    # `needs` isn't possible, so we gate only on unit-tests. Those checks still run
    # and report on every push; only the fail-fast skip is gone (#16).
    needs: [unit-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: minder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements/requirements.txt
          pip install -r src/requirements/requirements-dev.txt
          # tests/conftest.py loads every service's real main.py at collection
          # time (api-gateway, plugin-registry, marketplace, rag-pipeline,
          # model-management, tts-stt) -- each needs its own runtime deps too,
          # not just the shared root set above (#333: this was silently
          # failing before, unnoticed, since nothing depended on the load
          # actually succeeding until real tests started using it).
          pip install -r src/services/api-gateway/requirements.txt
          pip install -r src/services/plugin-registry/requirements.txt
          pip install -r src/services/marketplace/requirements.txt
          pip install -r src/services/rag-pipeline/requirements.txt
          pip install -r src/services/model-management/requirements.txt
          pip install -r src/services/tts-stt/requirements.txt

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: minder_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: minder_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: test_password
          JWT_SECRET: test_jwt_secret_for_ci
          NEO4J_AUTH: neo4j/test_password
        run: |
          pytest tests/integration/ -v \
            --tb=short \
            --timeout=600

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: minder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      # No --health-cmd: qdrant's minimal image has no curl/wget to run one
      # with. tests/e2e/conftest.py's own client-side health polling (rag-
      # pipeline's /health, which itself probes qdrant) already tolerates
      # qdrant's own startup lag, so nothing else needs to gate on it here.
      qdrant:
        image: qdrant/qdrant:v1.19
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements/requirements.txt
          pip install -r src/requirements/requirements-dev.txt
          # tests/e2e/ runs each service's REAL app as a bound uvicorn process
          # (not mocked) -- it needs each service's own runtime deps too, not
          # just the shared root set above.
          pip install -r src/services/api-gateway/requirements.txt
          pip install -r src/services/plugin-registry/requirements.txt
          pip install -r src/services/rag-pipeline/requirements.txt

      - name: Prepare /app (container-absolute-path symlinks, #318)
        # tests/e2e/conftest.py symlinks /app/{src,plugins,services/plugin-registry}
        # to the real checkout so every service's hardcoded
        # sys.path.insert(0, "/app/src") resolves without changing any service
        # code. The runner user can't create a directory at the filesystem
        # root without sudo; conftest.py itself doesn't (and shouldn't) use
        # sudo, so pre-create + chown it here instead.
        run: |
          sudo mkdir -p /app
          sudo chown -R "$(id -u):$(id -g)" /app

      - name: Run E2E tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: minder_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: minder_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: test_password
          JWT_SECRET: test_jwt_secret_for_ci
          NEO4J_AUTH: neo4j/test_password
        run: |
          pytest tests/e2e/ -v \
            --tb=short \
            --timeout=900

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.integration-tests.result }}" == "success" ] && \
             [ "${{ needs.e2e-tests.result }}" == "success" ]; then
              echo "✅ All tests successful!"
              exit 0
          else
              echo "❌ Some tests failed!"
              exit 1
          fi
