name: Docker Image Auto-Update

on:
  # Her Pazartesi 09:00 UTC'de çalıştır (Türkiye 12:00)
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manuel tetikleme için

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    name: Check for Docker Image Updates
    runs-on: ubuntu-latest

    outputs:
      updates-available: ${{ steps.check.outputs.updates-available }}
      safe-updates-available: ${{ steps.check.outputs.safe-updates-available }}
      risky-updates-available: ${{ steps.check.outputs.risky-updates-available }}
      up-to-date: ${{ steps.check.outputs.up-to-date }}
      manual-check-needed: ${{ steps.check.outputs.manual-check-needed }}
      excluded-local: ${{ steps.check.outputs.excluded-local }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check for updates
        id: check
        env:
          # For the GHCR->GitHub-releases lookup (raises the api.github.com rate limit
          # from 60/hr anonymous to 1000/hr); the call still works without it.
          GH_API_TOKEN: ${{ github.token }}
        run: |
          pip install pyyaml requests
          python scripts/check_docker_updates.py

      - name: Upload updates reports
        uses: actions/upload-artifact@v6
        with:
          name: docker-updates
          path: |
            updates.json
            safe-updates.json
            risky-updates.json
            up-to-date.json
            manual-check.json
            excluded-local.json
          retention-days: 7

      - name: Create issue with full report
        if: steps.check.outputs.updates-available == 'true' || steps.check.outputs.manual-check-needed == 'true' || steps.check.outputs.up-to-date == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const safeUpdates = JSON.parse(fs.readFileSync('safe-updates.json', 'utf8'));
            const riskyUpdates = JSON.parse(fs.readFileSync('risky-updates.json', 'utf8'));
            const upToDate = JSON.parse(fs.readFileSync('up-to-date.json', 'utf8'));
            const manualCheck = JSON.parse(fs.readFileSync('manual-check.json', 'utf8'));
            const excludedLocal = JSON.parse(fs.readFileSync('excluded-local.json', 'utf8'));

            const today = new Date().toISOString().split('T')[0];
            let body = `# Docker Image Updates Report\n\n`;
            body += `*Checked on ${today}*  \n`;
            body += `*This report covers ALL 3rd-party images in docker-compose.yml*\n\n`;

            // Section 1: Safe Updates (Patch/Minor)
            if (Object.keys(safeUpdates).length > 0) {
              body += `## ✅ Updates Available (Safe: Patch/Minor)\n\n`;
              body += `These updates are backwards-compatible and safe to apply:\n\n`;

              for (const [service, info] of Object.entries(safeUpdates)) {
                const classification = info.classification.toUpperCase();
                body += `- **${service}**: \`${info.current}\` → \`${info.latest}\` [${classification}]\n`;
              }
              body += `\n`;
            }

            // Section 2: Risky Updates (Major/Scheme-Change)
            if (Object.keys(riskyUpdates).length > 0) {
              body += `## ⚠️ Updates Available (Risky: Major/Scheme-Change)\n\n`;
              body += `These updates have major version jumps or versioning scheme changes.\n`;
              body += `**Breaking changes are likely. Review changelogs before applying.**\n\n`;

              for (const [service, info] of Object.entries(riskyUpdates)) {
                const classification = info.classification.toUpperCase();
                if (classification === 'SCHEME-CHANGE') {
                  body += `- **${service}**: \`${info.current}\` → \`${info.latest}\` [🚨 ${classification}]\n`;
                } else {
                  body += `- **${service}**: \`${info.current}\` → \`${info.latest}\` [${classification}]\n`;
                }
              }
              body += `\n`;
            }

            // Section 3: Up to Date
            if (Object.keys(upToDate).length > 0) {
              body += `## ✅ Up to Date\n\n`;
              body += `These images are confirmed current (no newer version in track):\n\n`;

              for (const [service, info] of Object.entries(upToDate)) {
                body += `- **${service}**: \`${info.image}:${info.current}\`\n`;
              }
              body += `\n`;
            }

            // Section 4: Manual Check Needed
            if (Object.keys(manualCheck).length > 0) {
              body += `## 🔍 Manual Check Needed\n\n`;
              body += `These images require manual verification (engine cannot auto-detect):\n\n`;

              for (const [service, info] of Object.entries(manualCheck)) {
                body += `### ${service}\n\n`;
                body += `- **Image**: \`${info.image}:${info.current}\`\n`;
                body += `- **Registry**: ${info.registry}\n`;
                if (info.latest) {
                  body += `- **Latest available**: \`${info.latest}\`\n`;
                }
                body += `- **Reason**: ${info.note}\n`;

                // Add specific guidance based on image type
                if (info.image.includes('minio')) {
                  body += `- **How to check**: Latest RELEASE.* tag on [Docker Hub](https://hub.docker.com/r/minio/minio/tags)\n`;
                } else if (info.registry === 'GHCR') {
                  body += `- **How to check**: [GitHub Container Registry](https://github.com/orgs/orgname/packages)\n`;
                } else if (info.registry === 'GCR') {
                  body += `- **How to check**: [Google Container Registry](https://console.cloud.google.com/gcr)\n`;
                } else if (info.current === 'latest') {
                  body += `- **How to check**: Switch to a specific version tag instead of :latest\n`;
                }
                body += `\n`;
              }
            }

            // Section 5: Excluded (Local Builds)
            if (Object.keys(excludedLocal).length > 0) {
              body += `## 🏠 Excluded (Local Builds)\n\n`;
              body += `These images are built locally and excluded from 3rd-party update checks:\n\n`;

              for (const [service, info] of Object.entries(excludedLocal)) {
                body += `- **${service}**: \`${info.image}\` — ${info.note}\n`;
              }
              body += `\n`;
              body += `*Note: Local builds stay at 1.0.0 until production readiness*\n\n`;
            }

            // Footer
            body += `---\n\n`;
            body += `## How to Apply Updates\n\n`;

            if (Object.keys(safeUpdates).length > 0 || Object.keys(riskyUpdates).length > 0) {
              body += `1. Review the update(s) above\n`;
              body += `2. Edit \`docker/docker-compose.yml\` to update the image tag\n`;
              body += `3. Run \`docker compose -f docker/docker-compose.yml pull\`\n`;
              body += `4. Run \`docker compose -f docker/docker-compose.yml up -d\`\n`;
              body += `5. Verify all services are healthy: \`docker ps --filter health=healthy\`\n\n`;
              body += `**Your commit message should include:**\n`;
              body += `\`\`\`\n`;
              body += `chore: bump [service] to [version] (Closes #XX)\n`;
              body += `\`\`\`\n`;
              body += `where **#XX** is this issue's number (above the title).\n`;
              body += `This auto-closes this issue when the commit lands on main.\n\n`;
            } else {
              body += `No auto-detectable updates available at this time.\n\n`;
              if (Object.keys(manualCheck).length > 0) {
                body += `> **Note**: Manual-check items still require periodic verification.\n`;
                body += `> See the "Manual Check Needed" section above.\n\n`;
              }
            }

            body += `## Summary\n\n`;
            body += `- **Safe updates**: ${Object.keys(safeUpdates).length}\n`;
            body += `- **Risky updates**: ${Object.keys(riskyUpdates).length}\n`;
            body += `- **Up to date**: ${Object.keys(upToDate).length}\n`;
            body += `- **Manual check needed**: ${Object.keys(manualCheck).length}\n`;
            body += `- **Excluded (local)**: ${Object.keys(excludedLocal).length}\n\n`;

            body += `*Generated by [Docker Image Auto-Update](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            // Find existing open bot issue(s). De-dup on the bot title PATTERN, not
            // today's date: matching on the date meant any run on a new calendar day
            // (e.g. a manual dispatch one day + the weekly cron the next) spawned a
            // brand-new issue instead of reusing the open one, so duplicates piled up.
            // The invariant is now "at most one open Docker-update issue at a time".
            const botIssuePattern = /^Docker Image Updates - \d{4}-\d{2}-\d{2}$/;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['dependencies', 'docker']
            });
            const botIssues = issues.data
              .filter(issue => botIssuePattern.test(issue.title))
              .sort((a, b) => a.number - b.number);

            if (botIssues.length > 0) {
              // Reuse the oldest open bot issue as the canonical living report:
              // refresh its title to today and overwrite its body with the latest scan.
              const canonical = botIssues[0];
              const finalBody = body.replace('#XX', '#' + canonical.number);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: canonical.number,
                title: 'Docker Image Updates - ' + today,
                body: finalBody
              });
              console.log('Refreshed existing issue #' + canonical.number);

              // Close any extra duplicates left over from the old per-date behavior.
              for (const dup of botIssues.slice(1)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup.number,
                  body: 'Superseded by #' + canonical.number + ' (consolidated into a single open Docker-update issue). Closing as duplicate.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup.number,
                  state: 'closed',
                  state_reason: 'not_planned'
                });
                console.log('Closed duplicate issue #' + dup.number);
              }
            } else {
              // No open bot issue — create one, then patch in its own number.
              const result = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Docker Image Updates - ' + today,
                body: body,
                labels: ['dependencies', 'docker']
              });

              const issueNumber = result.data.number;
              const finalBody = body.replace('#XX', '#' + issueNumber);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: finalBody
              });

              console.log('Created new issue #' + issueNumber);
            }

      - name: Close resolved issues (auto-reconcile)
        if: steps.check.outputs.safe-updates-available == 'false' && steps.check.outputs.risky-updates-available == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            // Find open dependency issues (strict bot title pattern)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['dependencies', 'docker']
            });

            // Only close bot-created issues with title pattern "Docker Image Updates - YYYY-MM-DD"
            const botIssuePattern = /^Docker Image Updates - \d{4}-\d{2}-\d{2}$/;
            const botIssues = issues.data.filter(issue => botIssuePattern.test(issue.title));

            if (botIssues.length === 0) {
              console.log('No bot-created issues to close');
              return;
            }

            for (const issue of botIssues) {
              // Add closing comment explaining why
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Resolved**\n\nAll auto-detectable Docker image updates have been applied.\n\nChecked: ${today}\n\n---\n\n**Note**: Manual-check items (GHCR, GCR, :latest tags) still require periodic human verification. See the latest report for details.\n\nThis issue was automatically closed because all safe/risky updates have been resolved.`
              });

              // Close the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });

              console.log('Closed resolved issue #' + issue.number);
            }

      - name: No updates notification
        if: steps.check.outputs.updates-available == 'false' && steps.check.outputs.manual-check-needed == 'false'
        run: |
          echo "[*] All 3rd-party images up to date"
          echo "[*] No action required"
